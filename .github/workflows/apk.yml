name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor
        run: npm install

      - name: Preparar la app web
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de ubicación
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' $M
          grep -n "LOCATION" $M

      - name: Ícono del pez
        run: |
          which convert || sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=android/app/src/main/res/mipmap-${pair%%:*}
            s=${pair##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icons/icon-512.png -resize ${s}x${s} $d/$n.png
            done
          done

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hay-pesca-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
